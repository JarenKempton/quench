[package]
name = "quench-judge"
version = "0.0.0"
edition = "2021"
description = "Model-backed judgments over agent sessions, behind one trait. Opt-in; the user's own key."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
