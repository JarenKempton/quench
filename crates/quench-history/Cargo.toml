[package]
name = "quench-history"
version = "0.0.0"
edition = "2021"
description = "Reads coding-agent session history from any harness into one normalized model."
publish = false

[dependencies]
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
