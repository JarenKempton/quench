[workspace]
resolver = "2"
members = [
    "crates/quench-core",
    "apps/desktop/src-tauri",
]

# quench#8: Cargo honors [profile.*] ONLY at the workspace root. Tauri's size guide
# tells you to put this in src-tauri/Cargo.toml, where in a workspace it silently
# no-ops with a warning (not an error) and ships unoptimized release builds. So it
# lives here, at the root, on purpose.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
