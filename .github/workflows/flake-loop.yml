name: flake-loop
on:
  push:
    branches: [fix/judge-macos-flakes]
jobs:
  ci-like:
    strategy:
      fail-fast: false
      matrix:
        runner: [vp, bun]
        shard: [1, 2, 3]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Temp folder in memory
        run: |
          diskutil erasevolume APFS quench-tmp "$(hdiutil attach -nomount ram://2097152 | awk '{print $1}')"
          echo "TMPDIR=/Volumes/quench-tmp" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vp check
      - run: bunx vp run compile
      - run: ./dist/quench --help >/dev/null && ./dist/quench --version
      - run: ps -axo pid,etime,%cpu,rss,command | sort -k3 -nr | head -15
      - name: tests x4
        run: |
          cp .github/flake/env.test.txt test/zz-env.test.ts
          fails=0
          for i in 1 2 3 4; do
            if [ "${{ matrix.runner }}" = vp ]; then cmd="bunx vp run test"; else cmd="bun test"; fi
            if $cmd > "$RUNNER_TEMP/it.txt" 2>&1; then :; else fails=$((fails+1)); echo "=== iteration $i FAILED"; fi
            grep -E "RUNNER-ENV|\(fail\)|timed out|dangling|Received" "$RUNNER_TEMP/it.txt" | sort -u | head -20
          done
          echo "RESULT runner=${{ matrix.runner }} fails=$fails/4"
