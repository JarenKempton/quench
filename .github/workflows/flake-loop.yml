name: flake-loop
on:
  push:
    branches: [fix/judge-macos-flakes]
jobs:
  judge:
    strategy:
      fail-fast: false
      matrix:
        load: [cpu, disk, disk-ramtmp]
        shard: [1, 2]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: matrix.load == 'cpu'
        run: for _ in 1 2 3 4; do nohup sh -c 'while :; do :; done' >/dev/null 2>&1 & done
      - if: startsWith(matrix.load, 'disk')
        run: nohup sh -c 'while :; do dd if=/dev/zero of="$RUNNER_TEMP/dd.bin" bs=1m count=512 2>/dev/null; sync; done' >/dev/null 2>&1 &
      - if: matrix.load == 'disk-ramtmp'
        run: |
          dev=$(hdiutil attach -nomount ram://2097152 | awk '{print $1}')
          diskutil erasevolume APFS quenchtmp "$dev"
          echo "TMPDIR=/Volumes/quenchtmp" >> "$GITHUB_ENV"
      - run: .github/flake/loop.sh 50 packages/judge/test/harness.test.ts packages/judge/test/themes.test.ts
