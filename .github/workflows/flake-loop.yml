name: flake-loop
on:
  push:
    branches: [fix/judge-macos-flakes]
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: sysctl -n hw.ncpu machdep.cpu.brand_string; sw_vers; df -h /
      - name: full suite x8 with stall probe
        run: |
          bun .github/flake/probe.ts "$RUNNER_TEMP/probe" > "$RUNNER_TEMP/probe.out" &
          probe=$!
          fails=0
          for i in $(seq 8); do
            echo "=== iteration $i $(date -u +%FT%T)"
            if (set -o pipefail; bun test 2>&1 | perl -MPOSIX=strftime -MTime::HiRes=time -pe '$t=time; printf "%s.%03d ", strftime("%H:%M:%S", gmtime($t)), ($t*1000)%1000' > "$RUNNER_TEMP/run.txt"); then :; else fails=$((fails+1)); fi
            grep -E '\(fail\)|timed out|dangling|Expected|Received|^ *[0-9]+ (pass|fail)$' "$RUNNER_TEMP/run.txt" || true
          done
          kill $probe
          echo "=== probe"
          cat "$RUNNER_TEMP/probe.out"
          echo "suite failures: $fails/8"
