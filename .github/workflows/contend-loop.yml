name: Contend loop

on:
  push:
    branches: [fix/windows-lock-contention]

jobs:
  loop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: |
          fails=0
          for i in $(seq 30); do
            if ! bun test packages/cli/test/skills-apply-safety.test.ts -t "24 processes" > out.txt 2>&1; then
              fails=$((fails+1)); echo "=== run $i failed"; cat out.txt
            else echo "run $i ok"; fi
          done
          echo "failures: $fails/30"
          test "$fails" = 0
