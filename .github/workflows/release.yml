name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Stable release: which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vp check
      - run: bunx vp run test
      - id: version
        name: Pick the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
            *) version="${latest#v}-nightly.$GITHUB_RUN_NUMBER" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the UI
        run: bun run --cwd packages/ui build
      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            bun build --compile --target=bun-$target \
              --define "process.env.QUENCH_VERSION=\"$VERSION\"" \
              packages/cli/src/main.ts --outfile dist/quench-$target
          done
          test "$(./dist/quench-linux-x64 --version)" = "quench $VERSION"
          test -f dist/quench-windows-x64.exe
          (cd dist && sha256sum quench-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
    outputs:
      version: ${{ steps.version.outputs.version }}

  smoke-darwin:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run the darwin binary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x dist/quench-darwin-arm64
          test "$(./dist/quench-darwin-arm64 --version)" = "quench $VERSION"
          report=$(HOME="$PWD/packages/history/test/fixtures/home" ./dist/quench-darwin-arm64 report --days 100000 --no-cache)
          grep -q "Claude Code" <<< "$report"

  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Stable' || 'Nightly' }}
    needs: [build, smoke-darwin]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish nightly
        if: github.event_name == 'push'
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/quench-* dist/SHA256SUMS install.sh install.ps1 --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" --notes "Built from $GITHUB_SHA. Install with: quench update --channel nightly"
      - name: Publish stable
        if: github.event_name == 'workflow_dispatch'
        run: gh release create "v$VERSION" dist/quench-* dist/SHA256SUMS install.sh install.ps1 --target "$GITHUB_SHA" --title "Quench v$VERSION" --generate-notes
