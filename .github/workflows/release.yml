name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version, e.g. 0.2.0. Defaults to the version the latest nightly previewed."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Promote the latest nightly to stable' || 'Nightly' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: plan
        name: Plan the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            bun scripts/release.ts stable "$VERSION" | tee -a "$GITHUB_OUTPUT"
          else
            bun scripts/release.ts nightly "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_OUTPUT"
          fi
      - run: git checkout --detach "${{ steps.plan.outputs.sha }}"
      - run: bun install --frozen-lockfile
      - run: bunx vp check
      - run: bunx vp run test
      - name: Build binaries
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target=bun-$target \
              --define "process.env.QUENCH_VERSION=\"$VERSION\"" \
              packages/cli/src/main.ts --outfile dist/quench-$target
          done
          test "$(./dist/quench-linux-x64 --version)" = "quench $VERSION"
          cd dist && sha256sum quench-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          flags=(--target "$SHA" --title "Quench $TAG" --generate-notes)
          if [ -n "$PREVIOUS" ]; then flags+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$TAG" dist/quench-* dist/SHA256SUMS "${flags[@]}"
