name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vp check
      - run: bunx vp run compile
      - run: ./dist/quench --help
      - run: ./dist/quench --version
      - run: |
          tmp=$(bun -p "require('node:os').tmpdir()")
          before=$(ls -A "$tmp" | grep -c '^quench-' || true)
          bunx vp run test
          sleep 2
          after=$(ls -A "$tmp" | grep -c '^quench-' || true)
          echo "quench-* entries in $tmp: $before -> $after"
          test "$after" -le "$before"
