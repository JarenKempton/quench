name: Lock repro
on:
  push:
    branches: [fix/lock-windows-contention]
jobs:
  loop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: |
          fails=0
          for i in $(seq 25); do
            bun test packages/cli/test/skills-apply-safety.test.ts -t "24 processes" > out.txt 2>&1 || { fails=$((fails+1)); grep -E "error|Error|EPERM|EBUSY|EACCES|code" out.txt | head -20; }
          done
          echo "failures: $fails/25"
          test "$fails" = 0
