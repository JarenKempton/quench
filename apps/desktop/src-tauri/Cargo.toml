[package]
name = "quench"
version = "0.0.0"
edition = "2021"
description = "Quench — visibility and control over everything entering AI coding agents' context"
publish = false

# quench#8: Tauri v2 generates src-tauri as lib+bin. The lib carries the app so a
# mobile entry point (and integration tests) can reach it; main.rs is a thin shim.
[lib]
name = "quench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
quench-core = { path = "../../../crates/quench-core" }
